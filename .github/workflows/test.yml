name: Tests

on:
  # Every pull request, including stacked ones whose base isn't main.
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:unit

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:storybook

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Root deps must be installed even though this job only builds docs-site:
      # Vite's tsconfig resolution can walk up past docs-site/tsconfig.json to
      # the repo-root tsconfig.json (extends astro/tsconfigs/base), which
      # fails to resolve if root node_modules isn't present.
      - run: npm ci
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
