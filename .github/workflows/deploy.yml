name: Deploy

# Deploys to Vercel (openspec/changes/add-vercel-deploy-pipeline, D0/D3).
# Previews and production are the Preview and Production environments of
# one project, and the team token reaches both, so pull-request code never
# runs where the token is:
#
# - preview-build.yml builds the pull request with no secrets;
# - this file runs on workflow_run / pull_request_target, so GitHub always
#   uses the definition on main, whatever a pull request changes;
# - preview-deploy uses the Neon key and the Vercel token first, and runs
#   the pull request's code (its migrations) only as its last step, with
#   nothing but the preview branch's database URL;
# - preview-verify runs on a fresh runner with preview-only secrets.
#
# All three preview jobs share one concurrency group per pull request
# (preview-<n>): a new push cancels the previous deploy or check, and
# preview-cleanup cancels whatever is still running before it deletes the
# database branch, so no check is left waiting on a deleted database.
on:
  workflow_run:
    workflows: [Preview build]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  preview-deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      actions: read
    concurrency:
      group: preview-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    env:
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # main's code: the helpers below are trusted.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@64.7.0
      # The pull request's build output: data, uploaded as-is, never run here.
      - uses: actions/download-artifact@v4
        with:
          name: preview-output
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: preview/.vercel/output
      - name: Neon branch pr-${{ env.PR }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_PREVIEW_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PREVIEW_PROJECT_ID }}
          NEON_DATABASE: ${{ vars.NEON_PREVIEW_DATABASE }}
          NEON_ROLE: ${{ vars.NEON_PREVIEW_ROLE }}
        run: node scripts/deploy/neon-branch.mjs ensure "pr-$PR"
      - name: Required settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PREVIEW_PROJECT_ID }}
        run: node scripts/deploy/check-settings.mjs --environment preview --with DATABASE_URL --with DATABASE_URL_UNPOOLED
      - name: Deploy to the preview project
        id: deploy
        working-directory: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PREVIEW_PROJECT_ID }}
        # Never --prod: this job only ever creates preview deployments. The
        # environment is explicit because Vercel makes a project's first
        # deployment production when it has none, and --json because the CLI
        # prints JSON, not the bare URL, when it isn't attached to a terminal.
        # The JSON is the deployment itself in CI, but wrapped in
        # { status, deployment } when the CLI thinks an agent runs it.
        run: |
          vercel deploy --prebuilt --yes --environment preview --json \
            --env DATABASE_URL="$DATABASE_URL" --env DATABASE_URL_UNPOOLED="$DATABASE_URL_UNPOOLED" > "$RUNNER_TEMP/deploy.json"
          url=$(node -p 'const j = JSON.parse(require("fs").readFileSync(process.argv[1])); (j.deployment ?? j).url' "$RUNNER_TEMP/deploy.json")
          case "$url" in https://*) ;; *) echo "No deployment URL in the CLI output"; exit 1 ;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url"
      # The pull request's code, last: every step that used the Vercel token
      # or the Neon key has run. Its environment is only the branch URLs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr
          persist-credentials: false
      - name: Migrate the preview branch (pull request's code)
        working-directory: pr
        run: |
          npm ci
          env -i PATH="$PATH" HOME="$HOME" CI=1 DB_ADAPTER=postgres \
            DATABASE_URL="$DATABASE_URL" DATABASE_URL_UNPOOLED="$DATABASE_URL_UNPOOLED" \
            npm run db:setup -- --no-seed --yes

  # A fresh runner: nothing the pull request's code did above can reach it.
  preview-verify:
    needs: preview-deploy
    runs-on: ubuntu-latest
    environment: preview
    # A remote deployment can stop answering; never wait GitHub's 6 hours.
    timeout-minutes: 30
    concurrency:
      group: preview-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      URL: ${{ needs.preview-deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ready, then sync static pages
        env:
          EMDASH_SYNC_PAT: ${{ secrets.EMDASH_SYNC_PAT }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/deploy/ready-and-sync.mjs "$URL"
      - name: Post the preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- vercel-preview -->'
            const issue_number = Number(process.env.PR)
            const body = `${marker}\n**Preview:** ${process.env.URL}\n\nCommit ${context.payload.workflow_run.head_sha.slice(0, 7)}. Test data only: don't upload real photos.`
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number })
            const mine = comments.find((c) => c.body?.startsWith(marker))
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ ...context.repo, issue_number, body })
      # The pull request's tests, last. They only get the preview's own
      # bypass secret.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr
          persist-credentials: false
      # The smoke set only: the full suite already runs in CI (test.yml),
      # on SQLite and on Postgres.
      - name: Smoke tests against the preview (pull request's code)
        working-directory: pr
        env:
          E2E_BASE_URL: ${{ needs.preview-deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.preview.config.ts

  preview-cleanup:
    # pull_request_target runs main's definition and checks out main: the
    # pull request's code is never run here.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    # Joins the pull request's group: a deploy or check still running is
    # cancelled before the branch it uses is deleted.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete Neon branch pr-${{ github.event.pull_request.number }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_PREVIEW_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PREVIEW_PROJECT_ID }}
        run: node scripts/deploy/neon-branch.mjs delete "pr-${{ github.event.pull_request.number }}"
